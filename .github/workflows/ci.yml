name: CI

on:
  pull_request:
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check-release-tag:
    name: Check for release tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.check.outputs.tagged }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Check for release tag on commit
        id: check
        shell: bash
        run: |
          if [[ -n "$(git tag --points-at "$GITHUB_SHA" --list 'v*')" ]]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate
    needs: check-release-tag
    if: |
      always() &&
      (needs.check-release-tag.result == 'skipped' ||
       (needs.check-release-tag.result == 'success' && needs.check-release-tag.outputs.tagged != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check installer Bash syntax
        shell: bash
        run: |
          bash -n scripts/installer.sh
          bash -n scripts/test-installer.sh

      - name: Test release installer behavior
        run: sudo env "PATH=$PATH" bash scripts/test-installer.sh

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Golar app and shared typecheck
        run: yarn typecheck:golar

      - name: Nuxt full typecheck
        run: yarn typecheck

      - name: Production build
        run: yarn build

      - name: Server and browser integration tests
        run: yarn test

  create-release:
    name: Create GitHub release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi

      - name: Stage Linux x64 archive
        run: yarn stage:release

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="releases/forum-${version}-linux-x64.tar.gz"
          filename="${archive##*/}"
          (cd releases && sha256sum "$filename" > "$filename.sha256")

      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/extract-release-notes.mjs "$version" > release-notes.md

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="releases/forum-${version}-linux-x64.tar.gz"
          gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag "$archive" "$archive.sha256"