name: CI

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Golar app and shared typecheck
        run: yarn typecheck:golar

      - name: Nuxt full typecheck
        run: yarn typecheck

      - name: Production build
        run: yarn build

      - name: Integration and health checks
        run: yarn test