name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-release-validation:
    name: verify successful run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require successful Pipeline run on dev for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          passed="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline.yml/runs?branch=dev&event=push&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq 'any(.workflow_runs[]; .head_sha == env.GITHUB_SHA and .head_branch == "dev" and .event == "push" and .status == "completed" and .conclusion == "success")')"
          if [[ "$passed" != "true" ]]; then
            echo "No successful Pipeline run for commit $GITHUB_SHA on dev; sync the commit and wait for CI before tagging."
            exit 1
          fi

  create-release:
    name: publish release
    needs: verify-release-validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi

      - name: Stage Linux x64 archive
        run: yarn stage:release

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="releases/forum-${version}-linux-x64.tar.gz"
          filename="${archive##*/}"
          (cd releases && sha256sum "$filename" > "$filename.sha256")

      - name: Extract release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/extract-release-notes.mjs "$version" > release-notes.md

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="releases/forum-${version}-linux-x64.tar.gz"
          gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag "$archive" "$archive.sha256"
